# SPDX-License-Identifier: MPL-2.0

name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-config:
    name: Release configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.19.0
          install-only: true
      - name: Validate release configuration without building or publishing
        run: goreleaser check

  verify:
    name: ${{ matrix.os }} / Go ${{ matrix.go }} / Terraform ${{ matrix.terraform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            go: '1.25.0'
            terraform: '1.17.0'
          - os: ubuntu-24.04
            go: '1.27.3'
            terraform: '1.17.0'
          - os: ubuntu-24.04-arm
            go: '1.27.3'
            terraform: '1.17.0'
          - os: macos-15-intel
            go: '1.27.3'
            terraform: '1.17.0'
          - os: macos-15
            go: '1.27.3'
            terraform: '1.17.0'
    env:
      GOTOOLCHAIN: local
      CHECKPOINT_DISABLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Build, test, vet and check generated documentation
        if: matrix.go != '1.25.0'
        run: go run ./tools verify -check-docs
      - name: Verify minimum provider Go version
        if: matrix.go == '1.25.0'
        run: go run ./tools verify
      - name: Require a clean generated diff
        run: git diff --exit-code
